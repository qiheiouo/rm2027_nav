map_odom_from_global_pose:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    global_pose_topic: /localization/global_pose
    # Selected gate status is read at <upstream_valid_topic>/status.
    upstream_valid_topic: ""
    status_timeout_sec: 1.0
    max_future_sec: 0.1
    # Set to /localization/lio_source_status only with the health-enabled adapter.
    # Then this bridge consumes atomic source evidence instead of bare odometry.
    source_health_topic: ""
    source_health_timeout: 0.3
    odom_topic: /odometry/lio
    map_to_odom_topic: /localization/map_to_odom
    publish_tf: true
    publish_rate_hz: 20.0
    odom_cache_size: 500
    max_pose_odom_dt_sec: 0.05
    max_global_pose_age_sec: 0.5
    pending_pose_max_wait_sec: 0.2
    pending_pose_max_size: 20
