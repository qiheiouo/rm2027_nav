# Simulation-only delta over nav2_phase1_5_mppi; no chassis/footprint changes.
controller_server:
  ros__parameters:
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # Two 5 cm map cells of translation in 3 s; yaw alone cannot renew progress.
      required_movement_radius: 0.10
      movement_time_allowance: 3.0
